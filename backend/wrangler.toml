# Cloudflare Workers configuration for FishLedger Backend
name = "fishledger-backend"
main = "src/index.ts"
compatibility_date = "2025-07-10"
compatibility_flags = ["nodejs_compat"]

# Worker configuration
[build]
command = ""


# Production environment variables (will be set via wrangler secrets)
# These are placeholders - actual values should be set using:
# wrangler secret put SUPABASE_URL
# wrangler secret put SUPABASE_ANON_KEY
# etc.

# Default environment variables for development
[vars]
ENVIRONMENT = "development"
LOG_LEVEL = "debug"
CORS_ORIGIN = "http://localhost:5000,http://localhost:8080,http://localhost:5173,http://localhost:3000,https://fishledger-frontend.pages.dev,https://fishledger-frontend-preview.pages.dev"
MAX_FILE_SIZE = "10485760"
RATE_LIMIT_WINDOW_MS = "900000"
RATE_LIMIT_MAX_REQUESTS = "100"

# Supabase Configuration (set via wrangler secrets)
SUPABASE_URL = "https://your-project.supabase.co"
SUPABASE_ANON_KEY = "your-supabase-anon-key-placeholder"
SUPABASE_SERVICE_ROLE_KEY = "your-supabase-service-role-key-placeholder"

# JWT Configuration (set via wrangler secrets)
JWT_SECRET = "your-jwt-secret-placeholder-must-be-at-least-32-characters"
JWT_REFRESH_SECRET = "your-jwt-refresh-secret-placeholder-must-be-at-least-32-characters"
JWT_EXPIRES_IN = "7d"
JWT_REFRESH_EXPIRES_IN = "30d"

# Cloudinary Configuration (set via wrangler secrets)
CLOUDINARY_CLOUD_NAME = "your-cloudinary-cloud-name-placeholder"
CLOUDINARY_API_KEY = "your-cloudinary-api-key-placeholder"
CLOUDINARY_API_SECRET = "your-cloudinary-api-secret-placeholder"

# Email Configuration (set via wrangler secrets)
EMAIL_HOST = "smtp.gmail.com"
EMAIL_PORT = "587"
EMAIL_USER = "your-email-user-placeholder"
EMAIL_PASSWORD = "your-email-password-placeholder"
EMAIL_FROM = "your-email-from-placeholder"

# Google OAuth Configuration (set via wrangler secrets)


