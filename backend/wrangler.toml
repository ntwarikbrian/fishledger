# Cloudflare Workers configuration for FishLedger Backend
name = "fishledger-backend"
main = "src/index.ts"
compatibility_date = "2025-07-10"
compatibility_flags = ["nodejs_compat"]

# Worker configuration
[build]
command = ""


# Production environment variables (will be set via wrangler secrets)
# IMPORTANT: The following secrets must be provided via `wrangler secret put`:
# - SUPABASE_URL
# - SUPABASE_ANON_KEY
# - SUPABASE_SERVICE_ROLE_KEY
# - JWT_SECRET
# - JWT_REFRESH_SECRET
# - CLOUDINARY_CLOUD_NAME
# - CLOUDINARY_API_KEY
# - CLOUDINARY_API_SECRET
# - EMAIL_USER
# - EMAIL_PASSWORD
#
# Any inline values for these keys in this file will be ignored in production pipelines.
# See backend/README.md for setup instructions.

# Default environment variables for development
[vars]
ENVIRONMENT = "development"
LOG_LEVEL = "debug"
CORS_ORIGIN = "http://localhost:5000,http://localhost:8080,http://localhost:5173,http://localhost:3000,https://fishledger-frontend.pages.dev,https://fishledger-frontend-preview.pages.dev"
MAX_FILE_SIZE = "10485760"
RATE_LIMIT_WINDOW_MS = "900000"
RATE_LIMIT_MAX_REQUESTS = "100"
JWT_EXPIRES_IN = "7d"
JWT_REFRESH_EXPIRES_IN = "30d"
EMAIL_HOST = "smtp.gmail.com"
EMAIL_PORT = "587"

# Development environment (for local testing)
[env.development]
name = "fishledger-backend-dev"
main = "src/index.ts"
[env.development.vars]
ENVIRONMENT = "development"
LOG_LEVEL = "debug"
CORS_ORIGIN = "http://localhost:5000,http://localhost:8080,http://localhost:5173,http://localhost:3000,https://fishledger-frontend.pages.dev,https://fishledger-frontend-preview.pages.dev"
MAX_FILE_SIZE = "10485760"
RATE_LIMIT_WINDOW_MS = "900000"
RATE_LIMIT_MAX_REQUESTS = "100"
JWT_EXPIRES_IN = "7d"
JWT_REFRESH_EXPIRES_IN = "30d"
EMAIL_HOST = "smtp.gmail.com"
EMAIL_PORT = "587"


# Production environment
[env.production]
name = "fishledger-backend-prod"
main = "src/index.ts"
[env.production.vars]
ENVIRONMENT = "production"
LOG_LEVEL = "info"
CORS_ORIGIN = "http://localhost:5000,http://localhost:8080,http://localhost:5173,http://localhost:3000,https://fishledger-frontend.pages.dev,https://fishledger-frontend-preview.pages.dev"
MAX_FILE_SIZE = "10485760"
RATE_LIMIT_WINDOW_MS = "900000"
RATE_LIMIT_MAX_REQUESTS = "100"
JWT_EXPIRES_IN = "7d"
JWT_REFRESH_EXPIRES_IN = "30d"
EMAIL_HOST = "smtp.gmail.com"
EMAIL_PORT = "587"

# Production secrets should be set via wrangler secret put commands